[package]
name = "swang-stodva-emu"
version = "0.0.1-alpha.1"
edition = "2021"
description = "Terminal (ratatui) emulator for the swang-stodva SW102 firmware"
license = "GPL-3.0-or-later"

[[bin]]
name = "swang-stodva-emu"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"

[build-dependencies]
cc = "1"
